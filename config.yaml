# ------------------------------------------------------------------ design
design:
  folds: 5
  targets_per_fold: 10            # class balanced, 5 per class, fewer if the test fold has fewer (creditcard: 6)
  cap: 3000                       # larger datasets are subsampled, stratified
  arms: [clean, attack, control]  # clean: b = 0; attack: b random rows overwritten by an exact copy of the target row with
                                  # the wrong label; control: the same rows, the copy with the true label
  budgets: [1, 2, 3, 4, 5]   # number of poison rows (exact copies, r = 0); nested

# ------------------------------------------------------------------ models
models:
  - {name: tabicl-n8,   kind: tabicl,   n_est: 8,  env: tabicl_env}
  - {name: tabpfn35-n8, kind: tabpfn35, n_est: 8,  env: tabfm_cu130}    # tabpfn 9.1.0, TabPFNV3p5
  - {name: catboost,    kind: catboost, threads: 6, env: tabicl_env}    # threads do not change a prediction

# ------------------------------------------------------------------ datasets
# The 30 datasets of the study: continuous features, both TFMs reach an AUC of at least 0.8 without attack.
# Loaded from the OpenML cache in cache/ (no download).
datasets:
